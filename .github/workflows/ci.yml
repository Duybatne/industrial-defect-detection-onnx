name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ONNX model for CI testing
        run: |
          python deployment/export_onnx.py --output weights/model.onnx
          python src/pipeline/security.py --encrypt weights/model.onnx --output weights/model.onnx.enc

      - name: Run test suite
        env:
          PYTHONPATH: .
          API_KEY: industrial-defect-secret-key-2026
        run: |
          pytest tests/ -v

      - name: Verify Docker build
        run: |
          docker build -t industrial-defect-detection-api:latest -f deployment/Dockerfile .
