project_name: "industrial-defect-detection-onnx"
seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  img_size: [224, 224]
  batch_size: 32
  num_workers: 2
  train_val_split: 0.8

model:
  backbone: "efficientnet_b0"
  pretrained: true
  num_classes: 2
  in_channels: 3
  drop_rate: 0.3

training:
  epochs: 25
  lr: 0.0003
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  loss_type: "focal"
  focal_gamma: 2.0
  focal_alpha: 0.25
  mixed_precision: true
  checkpoint_dir: "weights"
  early_stopping_patience: 7

export:
  onnx_path: "weights/model.onnx"
  opset_version: 17
  dynamic_axes: true
